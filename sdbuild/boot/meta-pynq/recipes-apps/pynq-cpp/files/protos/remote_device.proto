syntax = "proto3";

package remote_device;

service RemoteDevice {
    rpc interrupt_state(InterruptStateRequest) returns (InterruptStateResponse) {}
    rpc interrupts(stream InterruptRequest) returns (stream InterruptResponse) {}
    rpc complete_download(CompleteDownloadRequest) returns (CompleteDownloadResponse) {}
    rpc set_bitstream_attrs(SetBitstreamAttrsRequest) returns (SetBitstreamAttrsResponse) {}
    rpc download (stream DownloadRequest) returns (DownloadResponse) {}
    rpc set_pl_clk(SetPlClkRequest) returns (SetPlClkResponse) {}
    rpc shutdown(ShutdownRequest) returns (ShutdownResponse) {}
    rpc readfile(ReadFileRequest) returns (stream ReadFileResponse) {}
    rpc writefile(stream WriteFileRequest) returns (WriteFileResponse) {}
    rpc existsfile(ExistsFileRequest) returns (ExistsFileResponse) {}
    rpc makedir(MakeDirRequest) returns (MakeDirResponse) {}
    rpc removedir(RemoveDirRequest) returns (RemoveDirResponse) {}
    rpc set_device_tree(DeviceTreeRequest) returns (DeviceTreeResponse) {}
}

message InterruptStateRequest {}
message InterruptStateResponse { string generation = 1; }
message CompleteDownloadRequest { string generation = 1; }
message CompleteDownloadResponse {}

// Route entries run from the leaf controller towards the PS interrupt.
message InterruptRoute {
    uint64 address = 1;
    uint32 index = 2;
}

message InterruptRequest {
    enum Operation { ACQUIRE = 0; ARM = 1; CANCEL = 2; RELEASE = 3; }
    Operation operation = 1;
    uint64 subscription = 2;
    uint64 sequence = 3;
    string generation = 4;
    uint32 raw_irq = 5;
    repeated InterruptRoute route = 6;
}

message InterruptResponse {
    enum Event { ACQUIRED = 0; ARMED = 1; CANCELLED = 2; RELEASED = 3; FIRED = 4; ERROR = 5; }
    Event event = 1;
    uint64 subscription = 2;
    uint64 sequence = 3;
    string message = 4;
}

//Add ReadFileRequest/Response
message ReadFileRequest {
    string file_path = 1;
}

message ReadFileResponse {
    bytes data = 1;
}

//Add WriteFileRequest/Response
message WriteFileRequest {
    string file_path = 1;
    bytes data = 2;
    bool defer_interrupts = 3;
}

message WriteFileResponse { string interrupt_generation = 1; }

//Add existsfileRequest/Response
message ExistsFileRequest {
    string file_path = 1;
}

message ExistsFileResponse {
    bool exists = 1;
}

message MakeDirRequest {
    string dir_path = 1;
}

message MakeDirResponse {}

message RemoveDirRequest {
    string dir_path = 1;
}

message RemoveDirResponse {}
message SetBitstreamAttrsRequest {
    string binfile_name = 1;
    bool partial = 2;
}

message SetBitstreamAttrsResponse {
    bool status = 1;
}

message ShutdownRequest {}

message ShutdownResponse {
    bool status = 1;
}

message SetPlClkRequest {
    int32 i = 1;
    int32 div0 = 2;
    int32 div1 = 3;
    int32 clk_mhz = 4;
}

message SetPlClkResponse {
    bool status = 1;
}

message DownloadRequest {
    bytes buffer = 1; 
}

message DownloadResponse {
    bool status = 1;
}

message DeviceTreeRequest {
    string name = 1;
    bytes data = 2;
    bool remove = 3;
    bool clear = 4;
}

message DeviceTreeResponse {
    bool applied = 1;
}
